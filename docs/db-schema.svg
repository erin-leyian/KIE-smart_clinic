<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">KIE Smart Clinic Database Schema</title>
  <desc id="desc">Entity relationship diagram for Smart Clinic database tables and their connections.</desc>

  <style>
    .bg { fill: #f8fafc; }
    .table-box { fill: #ffffff; stroke: #1f2937; stroke-width: 1.5; }
    .table-head { fill: #e5e7eb; stroke: #1f2937; stroke-width: 1.5; }
    .table-title { font: 700 17px Arial, sans-serif; fill: #111827; }
    .field { font: 13px Arial, sans-serif; fill: #1f2937; }
    .fk { fill: none; stroke: #2563eb; stroke-width: 2.2; }
    .app { fill: none; stroke: #d97706; stroke-width: 2.2; stroke-dasharray: 8 6; }
    .label { font: 12px Arial, sans-serif; fill: #0f172a; }
    .legend-title { font: 700 14px Arial, sans-serif; fill: #0f172a; }
    .legend-text { font: 12px Arial, sans-serif; fill: #334155; }
  </style>

  <rect class="bg" x="0" y="0" width="1600" height="980" />

  <g>
    <rect class="table-box" x="680" y="40" width="240" height="170" rx="10"/>
    <rect class="table-head" x="680" y="40" width="240" height="38" rx="10"/>
    <text class="table-title" x="760" y="65" text-anchor="middle">users</text>
    <text class="field" x="696" y="98">id (PK)</text>
    <text class="field" x="696" y="120">role</text>
    <text class="field" x="696" y="142">email</text>
    <text class="field" x="696" y="164">phone</text>
    <text class="field" x="696" y="186">created_at</text>
  </g>

  <g>
    <rect class="table-box" x="140" y="260" width="280" height="140" rx="10"/>
    <rect class="table-head" x="140" y="260" width="280" height="38" rx="10"/>
    <text class="table-title" x="280" y="285" text-anchor="middle">doctor_specializations</text>
    <text class="field" x="156" y="318">id (PK)</text>
    <text class="field" x="156" y="340">doctor_id (FK)</text>
    <text class="field" x="156" y="362">specialization</text>
    <text class="field" x="156" y="384">consultation_fee</text>
  </g>

  <g>
    <rect class="table-box" x="460" y="260" width="230" height="120" rx="10"/>
    <rect class="table-head" x="460" y="260" width="230" height="38" rx="10"/>
    <text class="table-title" x="575" y="285" text-anchor="middle">available_hours</text>
    <text class="field" x="476" y="318">id (PK)</text>
    <text class="field" x="476" y="340">doctor_id (FK)</text>
    <text class="field" x="476" y="362">day / start / end</text>
  </g>

  <g>
    <rect class="table-box" x="760" y="260" width="280" height="160" rx="10"/>
    <rect class="table-head" x="760" y="260" width="280" height="38" rx="10"/>
    <text class="table-title" x="900" y="285" text-anchor="middle">appointments</text>
    <text class="field" x="776" y="318">id (PK)</text>
    <text class="field" x="776" y="340">doctor_id (FK)</text>
    <text class="field" x="776" y="362">patient_id (FK)</text>
    <text class="field" x="776" y="384">appointment_date / time</text>
    <text class="field" x="776" y="406">status</text>
  </g>

  <g>
    <rect class="table-box" x="1120" y="260" width="300" height="150" rx="10"/>
    <rect class="table-head" x="1120" y="260" width="300" height="38" rx="10"/>
    <text class="table-title" x="1270" y="285" text-anchor="middle">patient_records</text>
    <text class="field" x="1136" y="318">id (PK)</text>
    <text class="field" x="1136" y="340">patient_id (FK)</text>
    <text class="field" x="1136" y="362">doctor_id (FK)</text>
    <text class="field" x="1136" y="384">appointment_id (FK)</text>
  </g>

  <g>
    <rect class="table-box" x="760" y="500" width="280" height="160" rx="10"/>
    <rect class="table-head" x="760" y="500" width="280" height="38" rx="10"/>
    <text class="table-title" x="900" y="525" text-anchor="middle">queue_entries</text>
    <text class="field" x="776" y="558">id (PK)</text>
    <text class="field" x="776" y="580">appointment_id (FK)</text>
    <text class="field" x="776" y="602">patient_id (FK)</text>
    <text class="field" x="776" y="624">doctor_id (FK)</text>
    <text class="field" x="776" y="646">status / position</text>
  </g>

  <g>
    <rect class="table-box" x="430" y="500" width="230" height="130" rx="10"/>
    <rect class="table-head" x="430" y="500" width="230" height="38" rx="10"/>
    <text class="table-title" x="545" y="525" text-anchor="middle">notifications</text>
    <text class="field" x="446" y="558">id (PK)</text>
    <text class="field" x="446" y="580">user_id (FK)</text>
    <text class="field" x="446" y="602">type / read</text>
  </g>

  <g>
    <rect class="table-box" x="170" y="760" width="240" height="110" rx="10"/>
    <rect class="table-head" x="170" y="760" width="240" height="38" rx="10"/>
    <text class="table-title" x="290" y="785" text-anchor="middle">hospitals</text>
    <text class="field" x="186" y="818">id (PK)</text>
    <text class="field" x="186" y="840">name / location</text>
  </g>

  <g>
    <rect class="table-box" x="560" y="760" width="300" height="110" rx="10"/>
    <rect class="table-head" x="560" y="760" width="300" height="38" rx="10"/>
    <text class="table-title" x="710" y="785" text-anchor="middle">insurance_providers</text>
    <text class="field" x="576" y="818">id (PK)</text>
    <text class="field" x="576" y="840">name / type / coverage</text>
  </g>

  <g>
    <rect class="table-box" x="980" y="760" width="300" height="110" rx="10"/>
    <rect class="table-head" x="980" y="760" width="300" height="38" rx="10"/>
    <text class="table-title" x="1130" y="785" text-anchor="middle">medical_conditions</text>
    <text class="field" x="996" y="818">id (PK)</text>
    <text class="field" x="996" y="840">name / prevalence</text>
  </g>

  <path class="fk" d="M680 130 C560 150, 500 220, 420 300" />
  <text class="label" x="505" y="210">doctor_id_fk</text>

  <path class="fk" d="M760 210 C700 230, 650 240, 580 260" />
  <text class="label" x="650" y="235">doctor_id_fk</text>

  <path class="fk" d="M820 210 L820 260" />
  <text class="label" x="776" y="244">doctor_id_fk</text>

  <path class="fk" d="M860 210 L860 260" />
  <text class="label" x="864" y="244">patient_id_fk</text>

  <path class="fk" d="M920 140 C1020 170, 1080 220, 1120 300" />
  <text class="label" x="1035" y="210">doctor_id_fk / patient_id_fk</text>

  <path class="fk" d="M760 210 C690 280, 620 400, 545 500" />
  <text class="label" x="610" y="395">user_id_fk</text>

  <path class="fk" d="M900 210 C930 300, 940 410, 900 500" />
  <text class="label" x="915" y="398">doctor_id_fk / patient_id_fk</text>

  <path class="fk" d="M1040 330 C1080 330, 1100 330, 1120 330" />
  <text class="label" x="1058" y="318">appointment_id_fk</text>

  <path class="fk" d="M900 420 L900 500" />
  <text class="label" x="908" y="463">appointment_id_fk</text>

  <path class="app" d="M760 210 C620 430, 340 640, 290 760" />
  <text class="label" x="420" y="620">admin_manages_app_level</text>

  <path class="app" d="M800 210 C760 430, 720 640, 710 760" />
  <text class="label" x="730" y="620">admin_manages_app_level</text>

  <path class="app" d="M860 210 C930 430, 1100 640, 1130 760" />
  <text class="label" x="980" y="620">admin_manages_app_level</text>

  <g>
    <rect x="1260" y="44" width="300" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <text class="legend-title" x="1276" y="68">Legend</text>
    <line x1="1276" y1="86" x2="1336" y2="86" class="fk" />
    <text class="legend-text" x="1348" y="90">SQL foreign-key connection</text>
    <line x1="1276" y1="110" x2="1336" y2="110" class="app" />
    <text class="legend-text" x="1348" y="114">Application-level admin link</text>
    <text class="legend-text" x="1276" y="140">Generated for README preview compatibility.</text>
  </g>
</svg>
